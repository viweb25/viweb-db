# Every pull request: run every migration against a fresh PostgreSQL, then lint + tests.
# Every push to main: also build the migration image and push it as
# ghcr.io/<owner>/viweb-db:sha-<12 chars> (pinned by releases) and :main.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        # Keep in step with the production image in viweb-deploy/compose.yaml.
        image: postgres:16.8-alpine
        env:
          POSTGRES_USER: vi
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: viws
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vi -d viws"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://vi:ci@127.0.0.1:5432/viws
      DATABASE_TEST_URL: postgresql+asyncpg://vi:ci@127.0.0.1:5432/viws
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install uv==0.7.13
      - run: uv sync --frozen
      - name: Lint
        run: uv run --frozen ruff check database
      - name: Apply all migrations
        run: uv run --frozen alembic -c database/alembic.ini upgrade head
      - name: Test
        run: uv run --frozen pytest -q

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:main
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        run: echo "Pushed \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
